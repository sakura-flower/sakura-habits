                    <div class="days">

                        <div class="day">1</div>
                        <div class="day">1</div>
                        <div class="day">1</div>
                        <div class="day">1</div>

                    <div class="days">

     <button id="resetButton">Reset Button</button>

<style>
    body{
        background-image: url(clouds.jpg);
        background-size: 500px;
        background-color: rgb(255,227,227);
        text-align: center;
        font-family: 'Summer Farmhouse', sans-serif;
                                                
    }
    #title{
        margin-top: 100px;
        line-height: 10px;

    }

    #subtitle{
        opacity: 0.7;
        font-size: 18px;
        margin-bottom: 20px;

    }

    #calenderContainer{
        display: flex;
        justify-content: end;
    }

    #calenderDiv{
        background-color: rgb(255, 255, 255);
        border-radius: 10px 10px 20px 20px;
        margin: auto;
        align-content: center;
        text-align: center;
        
    }

    #calenderHeading{
        display: flex;
        justify-content: space-between;
        border-radius: 10px 10px 0px 0px;
        border: 2px solid black;
        padding: 0px 20px;
        font-size: 20px;
        background-color: pink;
        line-break: 0px;
    }

    #calenderContent{
        padding: 20px;
        border: 2px solid black;
    }

    .days{
        display: flex;
    }

    .day {
        width: 30px;
        margin: 3px;
        padding: 10px;
        font-size: 15px;
        text-align: center;
        border-radius: 20px;
       background-color: pink;
       border:2px solid black;
    }

</style>

<script>
    /* GET THE DATE */
    var date = new Date(); //create an instance of a Date object
    console.log(date); // print the date to the console

    /* EXTRACT THE CURRENT DATE INFO */
    var currentMonth = date.getMonth();
    var currentDay = date.getDay();
    var currentDate = date.getDate();
    var currentYear = date.getFullYear();

    console.log("the current month is" + currentMonth); // current month - 1
    console.log("the current weekday is" + currentDay); // day of the week
    console.log("the current date is" + currentDate); // current date number
    console.log("the current year is" + currentYear); // current year

    /* IMPORTANT DATE INFO*/
    var months = [
        "January", //0
        "February", //1
        "March", //2
        "April", //3
        "May", //4
        "June", //5
        "July", //6
        "August", //7
        "Spetember", //8
        "October", //9
        "November", //10
        "December", //11
    ];

    
    var title = document.getElementById("title"); //reference to the title
    title.innerHTML = "🌸" + months[currentMonth] + "🌸"; //change title to february

    
    var habitTitle = document.getElementById("habitTitle"); //reference to the habit
    habitTitle.onclick = function () {

        
        let habits = prompt("what's your habit", habitTitle.innerHTML);
        if(habits.length == 0){ //if they didnt type anything
            habitTitle.innerHTML = "click to set your habit";
        }else{ //update the habit to show what they typed
            habitTitle.innerHTML = habits;
        }
    }

    
    var daysInTheMonthList = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]
    var daysInThisMonth = daysInTheMonthList[currentMonth];

    var daysCompleted = 0;
    var totalDays = document.getElementById("totalDays");
    totalDays.innerHTML = "0/" + daysInThisMonth;

    
    var dayCount = 0;
    var rowCount = 0;
    var days = document.getElementsByClassName("days")
    for( var i=0; i < days.length; i++){
        var day = days[rowCount].getElementsByClassName("day");
        for ( var j=0; j < day.length; j++){
            if(dayCount == currentDate - 1){
                day[j].setAttribute("style","color:rgb(234, 1, 144);");
                day[j].setAttribute("style","border:2px solid black");
            }
            if (dayCount < daysInThisMonth) {
                day[j].innerHTML = dayCount + 1;
                day [j].setAttribute("id","day" + (dayCount + 1));
                dayCount++;
            } else {
                day[j].innerHTML = "";
                day[j].setAttribute("style", "background-color:white;")
            }
        }
        rowCount++;
    }

    
     var completed = new Array(31);
     for (var i = 0; i < dayCount; i++) {
        var tempString =
        "" + (currentMonth + 1) + "-" + (i + 1) + currentYear;
        console.log("storing date: " + tempString);
        var tempDay = localStorage.getItem(tempString);
        console.log(tempDay);
        if(tempDay == null || tempDay == "false"){
            localStorage.setItem(tempString, "false");
        } else if (tempDay == "true") {
            daysCompleted++;
        }
        totalDays.innerHTML = daysCompleted + "/" + daysInThisMonth;
    }

    console.log("completed array: " + completed);
    console.log("total days completed: " + daysCompleted);

   
    
    for (var i = 0; i < currentDate; i++) {
        var tempString  =
         "" + (currentMonth + 1) + "-" + (i + 1) + "-" + currentYear;
        console.log(tempString);

        var chosenDay = localStorage.getItem(tempString);
        console.log(i + 1 + ": " + chosenDay);
        var chosenDayDiv = document.getElementById("day" + (i + 1));
        if (chosenDay === "true") {
            chosenDayDiv.style.backgroundColor = "pink";
        } else if (chosenDay === "false") {
            chosenDayDiv.style.backgroundColor = "white";
        }
    }

    
    var dayDivs = document.querySelectorAll(".day");
    for (var i=0; i<currentDate;i++){
        dayDivs[i].onclick = function (e) {
            var num = e.target.innerText;
            var selectedDate = document.getElementById(e.target.id);
            var storageString = "" + (currentMonth + 1) + "-" + num + "-" + currentYear;
            if(localStorage.getItem(storageString) === "false"){
                selectedDate.style.backgroundColor = "pink";
                localStorage.setItem(storageString, true);
                daysCompleted++;
            }else if(localStorage.getItem(storageString) === "true"){
                selectedDate.style.backgroundColor = "white";
                localStorage.setItem(storageString, false);
                daysCompleted--;
            }
            totalDays.innerHTML = daysCompleted + "/" + dayCount;
            console.log(daysCompleted, currentDate);
            if(daysCompleted === currentDate){
                alert("great progresss");
            }

        }
    }


    var resetButton = document.getElementById("resetButton");
    resetButton.onclick = function () {
        for (var i = 0; i < dayCount; i++) {
            var tempStrings =
            "" + (currentMonth + 1) + "-" + (i + 1) + "-" + currentYear;
            localStorage.setItem(tempStrings, "false");
            var curDay = document.getElementById("day" + (i + 1));
            curDay.style.backgroungColor = "white";
        }
        daysCompleted = 0
        totalDays.innerHTML = daysCompleted + "/" + daysInThisMonth;
    }

</script>
</html>
